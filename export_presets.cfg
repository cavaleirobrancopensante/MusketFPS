[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*"
exclude_filter="tools/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>
#rotate-note{display:none;position:fixed;inset:0;z-index:9999;background:#10172a;color:#e8e4d8;font-family:Georgia,'Times New Roman',serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#rotate-note h1{color:#c9a14a;font-size:26px;font-weight:normal;letter-spacing:2px;margin:28px 0 10px;font-variant:small-caps}
#rotate-note p{font-size:17px;line-height:1.45;max-width:320px;margin:0;color:#c9ccd6}
#rotate-note .phone{width:64px;height:110px;border:4px solid #c9a14a;border-radius:12px;position:relative;animation:turn 2.4s ease-in-out infinite}
#rotate-note .phone:after{content:'';position:absolute;bottom:7px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#c9a14a}
#rotate-note .arrow{color:#c9a14a;font-size:30px;margin-top:-6px}
@keyframes turn{0%,20%{transform:rotate(0deg)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate-note{display:flex}}
</style>
<script>
window.addEventListener('DOMContentLoaded',function(){
var l=(navigator.language||'en').toLowerCase();
var t={en:['Turn your phone sideways','Musket FPS is played in landscape. Rotate your phone to begin.'],
pt:['Vire o celular de lado','Musket FPS é jogado na horizontal. Gire o celular para começar.'],
es:['Gira el móvil de lado','Musket FPS se juega en horizontal. Gira el móvil para empezar.']};
var k=l.indexOf('pt')==0?'pt':(l.indexOf('es')==0?'es':'en');
var d=document.createElement('div');d.id='rotate-note';
d.innerHTML='<div class=phone></div><div class=arrow>&#x21BA;</div><h1>'+t[k][0]+'</h1><p>'+t[k][1]+'</p>';
document.body.appendChild(d);
function lock(){try{if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}catch(e){}}
document.addEventListener('fullscreenchange',lock);lock();
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
